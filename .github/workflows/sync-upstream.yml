name: Sync Upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev

      - name: Sync dev to upstream/dev
        run: |
          git checkout -B dev upstream/dev
          git push origin dev --force

      - name: Rebase awmate onto dev
        run: |
          git checkout awmate
          git rebase dev
          git push origin awmate --force-with-lease